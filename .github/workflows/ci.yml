name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: destra
          POSTGRES_PASSWORD: destra
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U destra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_HOST: localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations match the schema
        run: |
          pnpm --filter @destra/db generate
          git diff --exit-code -- packages/db/drizzle || (echo "Schema changed without a migration. Run pnpm db:generate." && exit 1)
      - name: Create database roles
        run: psql "postgres://destra:destra@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f scripts/setup-local-db.sql
      - name: Test
        run: pnpm test
